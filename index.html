<!doctype html>
<html lang="hu">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Ütemterv</title>
<meta name="description" content="Nyilvános ütemterv: célok, határidők és előrehaladás.">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 3C33 16 52 28 52 42A20 20 0 0 1 12 42C12 28 31 16 32 3Z' fill='%23cfe4f4' stroke='%235a8fc0' stroke-width='2' stroke-linejoin='round'/%3E%3Cpath d='M15.5 53.3A20 20 0 0 0 51.6 38Q47 56 15.5 53.3Z' fill='%23e0b25c' stroke='%235f6f86' stroke-width='1.5' stroke-linejoin='round'/%3E%3Cpath d='M37 24Q37.8 29.2 41 30Q37.8 30.8 37 36Q36.2 30.8 33 30Q36.2 29.2 37 24ZM25 33Q25.8 38.2 29 39Q25.8 39.8 25 45Q24.2 39.8 21 39Q24.2 38.2 25 33ZM35 42Q35.6 45.4 38 46Q35.6 46.6 35 50Q34.4 46.6 32 46Q34.4 45.4 35 42Z' fill='%23e0b25c'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --font: Roboto, system-ui, -apple-system, "Segoe UI", "Helvetica Neue", Arial, sans-serif;
  --page: #f8f8fd;
  --surface: #ffffff;
  --ink: #1b1b21;
  --ink-2: #46464f;
  --ink-3: #6f6f7a;
  --grid: #e3e2ec;
  --outline: #c6c6d4;
  --grid-soft: #f0eff6;
  --hair: rgba(27, 27, 33, .10);
  --accent: #4f5ba8;
  --accent-c: #e0e2ff;
  --on-accent-c: #1f2a6b;
  --good: #2e8b62;
  --critical: #ba1a1a;
  --hz: 92, 107, 192;              /* hue of the horizon bands (rgb) */
  --labelW: 264px;                /* set by the script */
  --axisH: 72px;
  --r: 8px;
  --shadow-1: 0 1px 2px rgba(27, 27, 60, .14), 0 1px 3px 1px rgba(27, 27, 60, .07);
  --shadow-2: 0 4px 8px 3px rgba(27, 27, 60, .15), 0 1px 3px rgba(27, 27, 60, .3);
  color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { margin: 0; height: 100%; }
body { font-family: var(--font); color: var(--ink); background: var(--page); -webkit-font-smoothing: antialiased; -webkit-text-size-adjust: 100%; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.app { height: 100vh; height: 100dvh; min-height: 460px; display: flex; flex-direction: column; }

/* ---------- header ---------- */
.top { flex: none; display: flex; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 12px 24px; padding: 12px 20px; }
.brand { display: flex; align-items: center; gap: 12px; min-width: 0; }
.mark { flex: none; display: block; width: 40px; height: 40px; }
.brand h1 { margin: 0; font-size: 22px; line-height: 1.2; font-weight: 500;  }
.tools { display: flex; align-items: center; flex-wrap: wrap; gap: 8px 10px; }
.updated { margin-right: 4px; font-size: 12px; color: var(--ink-3); white-space: nowrap; }
.demo-badge { padding: 4px 10px; border-radius: 999px; background: #fff1cc; color: #7a4b00; font-size: 11.5px; font-weight: 500; white-space: nowrap; }
.seg { display: inline-flex; overflow: hidden; border: 1px solid var(--outline); border-radius: 20px; }
.seg button { height: 38px; border: 0; border-left: 1px solid var(--outline); background: none; padding: 0 16px; font-size: 14px; font-weight: 500; color: var(--ink); cursor: pointer; transition: background .15s; }
.seg button:first-child { border-left: 0; }
.seg button:hover { background: rgba(var(--hz), .08); }
.seg button[aria-pressed="true"] { background: var(--accent-c); color: var(--on-accent-c); }
.btn { display: inline-flex; align-items: center; gap: 8px; height: 40px; padding: 0 16px; border: 1px solid var(--outline); border-radius: 20px; background: none; color: var(--accent); font-size: 14px; font-weight: 500; cursor: pointer; transition: background .15s; }
.btn:hover { background: rgba(var(--hz), .08); }
.btn[aria-expanded="true"] { border-color: transparent; background: var(--accent-c); color: var(--on-accent-c); }
.app:not(.ready) .needs-data { visibility: hidden; }

/* ---------- legend ---------- */
.legend { flex: none; display: flex; flex-wrap: wrap; gap: 10px 28px; padding: 0 20px 14px; font-size: 12.5px; color: var(--ink-2); }
.lg-group { display: flex; align-items: center; flex-wrap: wrap; gap: 6px 14px; }
.lg-title, .c-title { font-size: 10.5px; font-weight: 500; letter-spacing: .07em; text-transform: uppercase; color: var(--ink-3); }
.lg-item { display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.lg-item .ic { width: 14px; height: 14px; }
.sw-ms { width: 9px; height: 9px; margin: 0 4px; border-radius: 2px; transform: rotate(45deg); background: var(--ink-2); }
.sw-card { width: 24px; height: 12px; border-radius: 4px; border: 1.5px dashed var(--ink-3); background: var(--surface); }

/* ---------- timeline frame ---------- */
.stage { flex: 1 1 auto; min-height: 0; display: flex; padding: 0 16px 16px; }
.tl-card { position: relative; flex: 1 1 auto; min-width: 0; min-height: 300px; display: flex; overflow: hidden; border-radius: 12px; background: var(--surface); box-shadow: var(--shadow-1); }
.tl-scroll { position: relative; z-index: 0; flex: 1 1 auto; min-width: 0; overflow: auto; overscroll-behavior: contain; scroll-padding: var(--axisH) 0 0 var(--labelW); }
.tl-scroll:focus-visible { outline-offset: -2px; }
.tl-scroll.dragging, .tl-scroll.dragging * { cursor: grabbing !important; user-select: none; }
.tl-inner { position: relative; }

/* sticky time axis */
.tl-head { position: sticky; top: 0; z-index: 30; display: flex; background: var(--surface); box-shadow: 0 1px 0 var(--grid); }
.tl-corner { position: sticky; left: 0; z-index: 3; flex: none; width: var(--labelW); height: var(--axisH); display: flex; flex-direction: column; justify-content: flex-end; gap: 7px; padding: 0 16px 13px 20px; background: var(--surface); box-shadow: inset -1px 0 0 var(--grid); }
.tl-axis { position: relative; flex: none; height: var(--axisH); }
.ax-row { position: absolute; left: 0; right: 0; }
.ax-t1 { top: 8px; height: 20px; }
.ax-t2 { top: 28px; height: 18px; }
.ax-hz { top: 46px; bottom: 0; }
.ax-u { position: absolute; top: 0; bottom: 0; white-space: nowrap; box-shadow: inset 1px 0 0 var(--grid-soft); }
.ax-t1 .ax-u { box-shadow: inset 1px 0 0 var(--grid); }
.ax-u > span { position: sticky; left: var(--labelW); display: block; width: max-content; padding: 0 8px; }
.ax-t1 .ax-u > span, .m-ax1 { font-size: 12px; line-height: 20px; font-weight: 500; }
.ax-t2 .ax-u > span, .m-ax2 { font-size: 11px; line-height: 18px; font-weight: 500; }
.ax-t2 .ax-u > span { color: var(--ink-3); }
.ax-band { position: absolute; top: 0; bottom: 0; padding: 2px 0 0 8px; }
.ax-band.h-next, .ax-band.h-later { box-shadow: inset 1px 0 0 rgba(var(--hz), .2); }
.ax-band > span { position: sticky; left: calc(var(--labelW) + 8px); display: inline-flex; align-items: baseline; gap: 6px; padding: 3px 10px; border-radius: 999px; color: #2f3a85; white-space: nowrap; }
.ax-band > span, .m-band { font-size: 11.5px; font-weight: 500; }
.ax-band em, .m-band-em { font-style: normal; font-size: 10.5px; font-weight: 500; }
.ax-band em { color: var(--ink-2); }
.ax-band.h-now > span { background: rgba(var(--hz), .14); }
.ax-band.h-next > span { background: rgba(var(--hz), .09); }
.ax-band.h-later > span { background: rgba(var(--hz), .055); }
.today-flag { position: absolute; top: 3px; transform: translateX(-100%); padding: 3px 8px 3px 9px; border-radius: 999px 3px 3px 999px; background: var(--accent); color: #fff; font-size: 11px; font-weight: 500; line-height: 14px; white-space: nowrap; }
.today-stem { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); }

/* background: horizon bands, gridlines, today line */
.tl-body { position: relative; }
.bg { position: absolute; top: 0; bottom: 0; z-index: 0; pointer-events: none; }
.band { position: absolute; top: 0; bottom: 0; }
.band.h-now { background: rgba(var(--hz), .10); }
.band.h-next { background: rgba(var(--hz), .06); box-shadow: inset 1px 0 0 rgba(var(--hz), .2); }
.band.h-later { background: rgba(var(--hz), .03); box-shadow: inset 1px 0 0 rgba(var(--hz), .16); }
.gl { position: absolute; top: 0; bottom: 0; width: 1px; background: #f1f1f7; }
.gl.q { background: #e8e8f1; }
.gl.y { background: #dcdce8; }
.today-line { position: absolute; top: 0; bottom: 0; width: 2px; margin-left: -1px; background: var(--accent); }

/* ---------- branches & lanes ---------- */
.branch { border-bottom: 1px solid var(--grid); }
.row { display: flex; border-bottom: 1px solid var(--grid-soft); }
.row:last-child { border-bottom: 0; }
.lbl { position: sticky; left: 0; z-index: 10; flex: none; width: var(--labelW); min-width: 0; display: flex; align-items: center; gap: 10px; padding: 0 14px 0 0; background: var(--surface); box-shadow: inset -1px 0 0 var(--grid); }
.scrolled-x .lbl { box-shadow: inset -1px 0 0 var(--grid), 8px 0 10px -8px rgba(20, 18, 40, .2); }
.track { position: relative; flex: none; cursor: grab; }
.rail, .lane-rail { align-self: stretch; flex: none; width: 4px; }
.rail { background: var(--c); }
.lane-rail { background: var(--lc); }
.lbl-branch { min-height: 46px; cursor: pointer; background: color-mix(in srgb, var(--c) 8%, var(--surface)); }
.lbl-branch:hover { background: color-mix(in srgb, var(--c) 13%, var(--surface)); }
.lbl-branch:focus-visible { outline-offset: -3px; }
.chev { flex: none; width: 16px; height: 16px; color: var(--ink-2); transition: transform .15s; }
.is-collapsed .chev { transform: rotate(-90deg); }
.b-text { min-width: 0; display: flex; flex-direction: column; gap: 5px; padding: 8px 0; }
.b-name { overflow: hidden; font-size: 14px; line-height: 18px; font-weight: 500; white-space: nowrap; text-overflow: ellipsis; }
.prog { display: flex; align-items: center; gap: 8px; font-size: 11.5px; line-height: 14px; font-weight: 500; color: var(--ink-2); white-space: nowrap; }
.pbar { flex: none; width: 72px; height: 6px; overflow: hidden; border-radius: 3px; background: color-mix(in srgb, var(--c) 16%, #e8e8f2); }
.pbar > i { display: block; height: 100%; border-radius: 3px; background: var(--c); }
.track-head { cursor: pointer; background: color-mix(in srgb, var(--c) 4%, transparent); }
.lbl-lane { background: color-mix(in srgb, var(--lc) 7%, var(--surface)); }
.l-name { flex: 1 1 auto; min-width: 0; margin-left: 26px; overflow: hidden; font-size: 13px; line-height: 17px; font-weight: 500; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.l-prog { flex: none; display: flex; align-items: center; gap: 6px; font-size: 11px; font-weight: 500; color: var(--ink-3); }
.l-prog .pbar { width: 30px; height: 4px; }

/* ---------- goals ---------- */
.item { position: absolute; z-index: 1; height: 40px; border-radius: var(--r); cursor: pointer; outline: none; -webkit-tap-highlight-color: transparent; }
.item:hover { z-index: 3; --lift: 0 6px 16px rgba(20, 18, 40, .13); }
.item:focus-visible { z-index: 3; outline: 2px solid var(--accent); outline-offset: 2px; }
.item.is-active { z-index: 4; outline: 2px solid var(--accent); outline-offset: 2px; }
.content { position: relative; display: flex; align-items: center; gap: 8px; height: 100%; padding: 0 10px; }
.ic { flex: none; display: block; width: 16px; height: 16px; }
.ic-planned { color: var(--ink-3); }
.ic-progress { color: var(--ink-2); }
.ic-done { color: var(--good); }
.ic-delayed { color: var(--critical); }
.txt { flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; justify-content: center; }
.t, .m-title { font-size: 13px; line-height: 16px; font-weight: 500;  }
.t { overflow: hidden; color: var(--ink); white-space: nowrap; text-overflow: ellipsis; }
.t.wrap { white-space: normal; overflow-wrap: break-word; -webkit-hyphens: auto; hyphens: auto; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; }
.meta, .m-meta { font-size: 11px; line-height: 14px; font-weight: 500; }
.meta { display: flex; align-items: center; gap: 6px; margin-top: 1px; overflow: hidden; color: var(--ink-2); white-space: nowrap; }
.htag, .m-tag { font-size: 10px; line-height: 14px; font-weight: 500; letter-spacing: .01em; }
.htag { flex: none; padding: 0 6px; border-radius: 999px; color: #2f3a85; background: rgba(var(--hz), .13); }
.htag.h-next { background: rgba(var(--hz), .085); }
.htag.h-later { color: #4a5290; background: rgba(var(--hz), .055); }
.own { flex: none; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%; background: var(--accent-c); color: var(--on-accent-c); font-size: 9.5px; font-weight: 500; letter-spacing: .02em; }

/* bars (start + due) and open-ended bars (start only) */
.bar { position: absolute; top: 0; bottom: 0; left: 0; right: 0; border-radius: var(--r); background: color-mix(in srgb, var(--c) 10%, var(--surface)); --ring: inset 0 0 0 1px color-mix(in srgb, var(--c) 40%, var(--surface)); box-shadow: var(--ring), var(--lift, 0 0 #0000); }
.out > .bar { right: auto; }
.s-progress > .bar { background: color-mix(in srgb, var(--c) 18%, var(--surface)); --ring: inset 3px 0 0 var(--c), inset 0 0 0 1px color-mix(in srgb, var(--c) 50%, var(--surface)); }
.s-done > .bar { background: color-mix(in srgb, var(--c) 34%, var(--surface)); --ring: inset 0 0 0 1px color-mix(in srgb, var(--c) 58%, var(--surface)); }
.s-delayed > .bar { --ring: inset 0 0 0 1.5px var(--critical); }
.k-open > .bar { -webkit-mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); mask-image: linear-gradient(90deg, #000 calc(100% - 56px), transparent); }
.in > .content { position: sticky; left: calc(var(--labelW) + 6px); width: max-content; max-width: 100%; }
/* label chip next to a short bar or a milestone */
.chip { position: absolute; top: 0; bottom: 0; border-radius: var(--r); background: rgba(255, 255, 255, .95); box-shadow: inset 0 0 0 1px var(--hair), var(--lift, 0 0 #0000); }
.s-delayed > .chip { box-shadow: inset 0 0 0 1.5px var(--critical), var(--lift, 0 0 #0000); }
/* milestones (due date only) */
.diamond { position: absolute; top: 50%; width: 14px; height: 14px; margin: -7px 0 0 -7px; border-radius: 3px; transform: rotate(45deg); background: var(--c); box-shadow: 0 0 0 2px var(--surface); }
.s-planned > .diamond { background: var(--surface); box-shadow: inset 0 0 0 2.5px var(--c), 0 0 0 2px var(--surface); }
.s-delayed > .diamond { box-shadow: 0 0 0 2px var(--surface), 0 0 0 3.5px var(--critical); }
/* approximate cards (no dates) */
.card { position: absolute; inset: 0; gap: 7px; padding: 0 8px 0 9px; border-radius: var(--r); border: 1.5px dashed color-mix(in srgb, var(--c) 60%, var(--surface)); background: rgba(255, 255, 255, .82); box-shadow: var(--lift, 0 0 #0000); }
.k-undated .t { color: #33333c; }
.s-progress > .card { background: color-mix(in srgb, var(--c) 9%, var(--surface)); }
.s-done > .card { background: color-mix(in srgb, var(--c) 24%, var(--surface)); }
.s-delayed > .card { border-color: var(--critical); }

/* compact markers in a collapsed branch */
.mk { position: absolute; z-index: 1; height: 8px; border-radius: 4px; cursor: pointer; outline: none; background: color-mix(in srgb, var(--c) 50%, var(--surface)); }
.mk::after { content: ""; position: absolute; inset: -7px -2px; }
.mk.s-done { background: var(--c); }
.mk.s-delayed { box-shadow: 0 0 0 1.5px var(--critical); }
.mk.k-milestone { width: 10px; height: 10px; border-radius: 2px; transform: rotate(45deg); background: var(--c); }
.mk.k-undated { height: 10px; border: 1.5px dashed color-mix(in srgb, var(--c) 70%, var(--surface)); background: var(--surface); }
.mk.k-open { -webkit-mask-image: linear-gradient(90deg, #000 55%, transparent); mask-image: linear-gradient(90deg, #000 55%, transparent); }
.mk:hover, .mk:focus-visible, .mk.is-active { z-index: 3; outline: 2px solid var(--accent); outline-offset: 2px; }

/* ---------- popover ---------- */
.pop { position: fixed; z-index: 100; width: min(360px, calc(100vw - 24px)); max-height: calc(100vh - 24px); overflow: auto; padding: 20px; border-radius: 16px; background: var(--surface); box-shadow: var(--shadow-2); font-size: 13px; outline: none; animation: pop-in .14s ease-out; }
@keyframes pop-in { from { opacity: 0; transform: translateY(4px) scale(.98); } }
.pop-crumb { display: flex; align-items: center; flex-wrap: wrap; gap: 6px; padding-right: 32px; font-size: 12px; font-weight: 500; color: var(--ink-2); }
.pop-crumb .dot { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.pop-crumb .sep { color: var(--ink-3); }
.pop h2 { display: flex; align-items: flex-start; gap: 8px; margin: 8px 0 10px; font-size: 16px; line-height: 1.3; }
.pop h2 .ic { margin-top: 2px; }
.pop-x { position: absolute; top: 8px; right: 8px; width: 40px; height: 40px; border: 0; border-radius: 50%; background: none; color: var(--ink-3); font-size: 20px; line-height: 1; cursor: pointer; }
.pop-x:hover { background: #eeeef6; color: var(--ink); }
.pop-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
.pchip { display: inline-flex; align-items: center; gap: 5px; padding: 4px 10px; border-radius: 8px; background: #eeeef6; color: var(--ink-2); font-size: 12px; font-weight: 500; }
.pchip .ic { width: 14px; height: 14px; margin-left: -2px; }
.pchip.hz { color: #2f3a85; background: rgba(var(--hz), .11); }
.facts { display: grid; grid-template-columns: auto 1fr; align-items: center; gap: 7px 14px; margin: 0; }
.facts dt { color: var(--ink-3); font-weight: 500; }
.facts dd { margin: 0; font-weight: 500; }
.facts .rel { color: var(--ink-3); font-weight: 400; }
.facts .own { display: inline-grid; margin-right: 7px; vertical-align: middle; }
.pop-desc { margin: 12px 0 0; color: var(--ink-2); line-height: 1.5; white-space: pre-line; }
.pop-link { display: inline-flex; align-items: center; gap: 8px; min-height: 40px; margin-top: 16px; padding: 8px 16px; border-radius: 20px; background: var(--accent-c); color: var(--on-accent-c); font-weight: 500; text-decoration: none; }
.pop-link:hover { background: #d3d6fb; }
.pop-link .host { color: var(--ink-2); font-weight: 500; }
.backdrop { position: fixed; inset: 0; z-index: 99; background: rgba(20, 18, 30, .3); }
.pop.sheet { top: auto !important; left: 0 !important; right: 0; bottom: 0; width: 100%; max-height: 78vh; max-height: 78dvh; padding: 20px 20px calc(20px + env(safe-area-inset-bottom)); border-radius: 28px 28px 0 0; animation: sheet-in .2s ease-out; }
@keyframes sheet-in { from { opacity: .6; transform: translateY(30px); } }

/* ---------- loading / error / debug ---------- */
.state { position: absolute; inset: 0; overflow: auto; }
.sk { padding: 24px 20px; }
.sk-msg { display: flex; align-items: center; gap: 10px; margin-bottom: 24px; font-size: 13px; font-weight: 500; color: var(--ink-2); }
.spin { width: 16px; height: 16px; border-radius: 50%; border: 2px solid #dcdbe6; border-top-color: var(--accent); animation: spin .8s linear infinite; }
@keyframes spin { to { transform: rotate(360deg); } }
.sk-row { display: flex; align-items: center; gap: 20px; margin-bottom: 16px; }
.sk-l { flex: none; width: 170px; height: 14px; border-radius: 7px; }
.sk-b { height: 30px; border-radius: 8px; }
.sk-l, .sk-b { background: linear-gradient(90deg, #eeeef6 20%, #f7f7fc 40%, #eeeef6 60%); background-size: 300% 100%; animation: shimmer 1.5s linear infinite; }
@keyframes shimmer { from { background-position: 100% 0; } to { background-position: 0 0; } }
.msg { max-width: 500px; margin: 56px auto; padding: 0 24px; text-align: center; }
.msg-ic { display: grid; place-items: center; width: 44px; height: 44px; margin: 0 auto 14px; border-radius: 50%; background: #fdecec; color: var(--critical); font-size: 22px; font-weight: 500; }
.msg.empty .msg-ic { background: #eeeef6; color: var(--ink-2); }
.msg h2 { margin: 0 0 8px; font-size: 18px; }
.msg p { margin: 0 0 16px; color: var(--ink-2); font-size: 14px; line-height: 1.5; }
.msg details { margin-top: 18px; padding: 10px 14px; border-radius: 10px; background: #f8f8fd; color: var(--ink-2); font-size: 12.5px; text-align: left; }
.msg details p { margin: 8px 0; font-size: 12.5px; }
.msg summary { cursor: pointer; font-weight: 500; }
.msg code { word-break: break-all; }
.dbg { position: fixed; right: 12px; bottom: 12px; z-index: 90; width: min(560px, calc(100vw - 24px)); max-height: 45vh; overflow: auto; padding: 12px 40px 12px 14px; border-radius: 12px; background: #1f1d2b; color: #f3f2ff; font: 12px/1.5 ui-monospace, Consolas, monospace; box-shadow: var(--shadow-2); }
.dbg ol { margin: 8px 0 0; padding-left: 20px; }
.dbg button { position: absolute; top: 6px; right: 8px; border: 0; background: none; color: #f3f2ff; font-size: 18px; cursor: pointer; }

/* ---------- narrow screens: lane labels move above their lanes ---------- */
.compact .tl-corner { display: none; }
.compact .row { display: block; }
.compact .lbl { width: max-content; max-width: 100vw; background: transparent; box-shadow: none; }
.compact .row-head { background: color-mix(in srgb, var(--c) 8%, var(--surface)); }

<script>

/* ===================================================================== */


/* ---------- constants ---------- */

const ZOOMS = ['month', 'quarter', 'year'];
const HKEYS = ['now', 'next', 'later'];
const L = { rowH: 48, itemH: 40, pad: 8, gap: 8, headH: 46, axisH: 72, cardW: { month: 220, quarter: 210, year: 196 }, cardMin: 150, labelMax: 330 };
const EXTRA_COLOR = '#8e90a0';
const DEBUG = /[?&]debug\b/i.test(location.search);

const STATUS = { planned: 'Tervezett', progress: 'Folyamatban', done: 'Kész', delayed: 'Késésben' };
const HU_MONTHS = ['január', 'február', 'március', 'április', 'május', 'június', 'július', 'augusztus', 'szeptember', 'október', 'november', 'december'];

const ROMAN = ['I.', 'II.', 'III.', 'IV.'];

const ICON = {
  planned: '<svg class="ic ic-planned" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>',
  progress: '<svg class="ic ic-progress" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="6" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 4.4a3.6 3.6 0 0 1 0 7.2z" fill="currentColor"/></svg>',
  done: '<svg class="ic ic-done" viewBox="0 0 16 16" aria-hidden="true"><circle cx="8" cy="8" r="7.2" fill="currentColor"/><path d="M4.9 8.3l2.1 2.1 4.1-4.6" fill="none" stroke="#fff" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>',
  delayed: '<svg class="ic ic-delayed" viewBox="0 0 16 16" aria-hidden="true"><path d="M8 1.8 14.9 13.9H1.1z" fill="currentColor" stroke="currentColor" stroke-width="1.2" stroke-linejoin="round"/><path d="M8 6.2v3.4" stroke="#fff" stroke-width="1.7" stroke-linecap="round"/><circle cx="8" cy="11.7" r=".95" fill="#fff"/></svg>',
};
const CHEV = '<svg class="chev" viewBox="0 0 16 16" aria-hidden="true"><path d="M4 6l4 4 4-4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>';
const EXT = '<svg width="13" height="13" viewBox="0 0 16 16" aria-hidden="true"><path d="M6.5 3H3.5A1.5 1.5 0 0 0 2 4.5v8A1.5 1.5 0 0 0 3.5 14h8a1.5 1.5 0 0 0 1.5-1.5v-3M9 2h5v5M14 2 7.5 8.5" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></svg>';

/* Accepted spellings (lower-case, "_" and "-" count as spaces) */
const norm = s => String(s == null ? '' : s).trim().toLowerCase().replace(/[\s_\-]+/g, ' ');
const aliasMap = groups => {

};
const HEADER_MAP = aliasMap({
  branch: ['branch', 'ág', 'terület'],
  sub_branch: ['sub_branch', 'subbranch', 'alág', 'projekt', 'alterület'],
  goal: ['goal', 'cél', 'title'],
  description: ['description', 'leírás'],
  horizon: ['horizon', 'horizont', 'időtáv'],
  start_date: ['start_date', 'start', 'kezdés'],
  due_date: ['due_date', 'due', 'deadline', 'határidő'],
  status: ['status', 'státusz', 'állapot'],
  owner: ['owner', 'felelős'],
  link: ['link', 'url', 'hivatkozás'],
});
const HORIZON_MAP = aliasMap({ now: ['now', 'most'], next: ['next', 'következő', 'kovetkezo'], later: ['later', 'később', 'kesobb'] });
const STATUS_MAP = aliasMap({
  planned: ['planned', 'plan', 'todo', 'to do', 'tervezett', 'terv'],
  progress: ['in progress', 'inprogress', 'progress', 'ongoing', 'folyamatban'],
  done: ['done', 'complete', 'completed', 'finished', 'kész', 'kesz', 'teljesítve'],
  delayed: ['delayed', 'late', 'blocked', 'késésben', 'késik', 'csúszik'],

/* ---------- dates: whole days counted from 1970-01-01 ---------- */
const DAY = 864e5;
const dn = (y, m, d) => Math.round(Date.UTC(y, m - 1, d) / DAY);
const ymd = n => { const t = new Date(n * DAY); return [t.getUTCFullYear(), t.getUTCMonth() + 1, t.getUTCDate()]; };
const daysIn = (y, m) => new Date(Date.UTC(y, m, 0)).getUTCDate();
const monthStart = n => { const [y, m] = ymd(n); return dn(y, m, 1); };
function addMonths(n, k) {
  const whole = Math.floor(k), frac = k - whole;
  let [y, m, d] = ymd(n);
  const t = y * 12 + (m - 1) + whole;
  y = Math.floor(t / 12); m = t - y * 12 + 1;
  return dn(y, m, Math.min(d, daysIn(y, m))) + Math.round(frac * 30.44);
}
const TODAY = (() => { const t = new Date(); return dn(t.getFullYear(), t.getMonth() + 1, t.getDate()); })();
const iso = n => { const [y, m, d] = ymd(n); return `${y}-${String(m).padStart(2, '0')}-${String(d).padStart(2, '0')}`; };
const fmtShort = n => { const [, m, d] = ymd(n); return `${HU_MON[m - 1]} ${d}.`; };
const fmtLong = n => { const [y, m, d] = ymd(n); return `${y}. ${HU_MONTHS[m - 1]} ${d}.`; };
function fmtStamp(t) {
  const p = v => String(v).padStart(2, '0');
  return `${t.getFullYear()}. ${HU_MON[t.getMonth()]} ${t.getDate()}. ${p(t.getHours())}:${p(t.getMinutes())}`;
}
function relDays(n) {
  const diff = n - TODAY, a = Math.abs(diff);
  if (diff === 0) return 'ma';
  if (diff === 1) return 'holnap';
  if (diff === -1) return 'tegnap';
  if (a < 60) return diff > 0 ? `${a} nap múlva` : `${a} napja`;
  const mo = Math.round(a / 30.44);
  return diff > 0 ? `kb. ${mo} hónap múlva` : `kb. ${mo} hónapja`;
}

/* ---------- small helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const px = v => Math.round(v * 10) / 10;
const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
const fmtNum = n => String(n).replace('.', ',');

const el = {
  app: $('.app'), scroller: $('#scroller'), inner: $('#inner'), state: $('#state'), legend: $('#legend'), legendBtn: $('#legendBtn'),
  updated: $('#updated'), demo: $('#demoBadge'), today: $('#todayBtn'), zoomBtns: [...document.querySelectorAll('[data-zoom]')],
};
const S = { model: null, bands: null, range: null, zoom: 'quarter', geom: null, collapsed: new Set(), pop: null, warnings: [], focus: TODAY, quietUntil: 0, lastLeft: 0 };
const SKELETON = '<div class="sk" aria-live="polite"><div class="sk-msg"><span class="spin"></span>Ütemterv betöltése…</div>'
  + [70, 45, 60, 30, 52].map((w, i) => `<div class="sk-row"><div class="sk-l"></div><div class="sk-b" style="width:${w}%;margin-left:${(i * 7) % 20}%"></div></div>`).join('') + '</div>';

class LoadError extends Error {
  constructor(kind, detail) { super(kind); this.kind = kind; this.detail = detail || ''; }
}
function warn(msg) { S.warnings.push(msg); console.warn('[Roadmap] ' + msg); }

/* Text width, measured with the page's own fonts (cached) */
const meas = document.createElement('span');
meas.setAttribute('aria-hidden', 'true');
meas.style.cssText = 'position:absolute;left:-9999px;top:0;visibility:hidden;white-space:nowrap';
document.body.appendChild(meas);
const measCache = new Map();
function textW(text, cls) {
  const key = cls + '|' + text;
  let w = measCache.get(key);
  if (w === undefined) {
    meas.className = cls;
    meas.textContent = text;
    w = meas.getBoundingClientRect().width;
    measCache.set(key, w);
  }
  return w;
}

/* ---------- loading the sheet ---------- */
async function fetchCSV() {
  const base = String(CONFIG.CSV_URL || '').trim() || 'roadmap_template.csv';
  const url = base + (base.includes('?') ? '&' : '?') + '_=' + Date.now();   // cache-buster
  const ctrl = new AbortController();
  const timer = setTimeout(() => ctrl.abort(), 20000);
  let res;
  try {
    res = await fetch(url, { cache: 'no-store', signal: ctrl.signal });
  } catch (e) {
    throw new LoadError(e.name === 'AbortError' ? 'timeout' : 'network', `${e.message} – ${base}`);
  } finally {
    clearTimeout(timer);
  }
  if (!res.ok) throw new LoadError('http', `HTTP ${res.status} – ${base}`);
  const text = await res.text();
  if (/^\s*<(!doctype|html)/i.test(text)) throw new LoadError('html', base);
  const lm = res.headers.get('Last-Modified');
  return { text, lastModified: lm ? new Date(lm) : null };
}

function parseCSV(text) {
  text = text.replace(/^﻿/, '');
  const first = text.slice(0, text.search(/\r?\n|$/));
  const delim = [',', ';', '\t'].map(d => [d, first.split(d).length]).sort((a, b) => b[1] - a[1])[0][0];
  if (window.Papa) return Papa.parse(text, { delimiter: delim, skipEmptyLines: false }).data;
  return miniCSV(text, delim);   // fallback if the CDN library could not load
}
function miniCSV(text, delim) {
  const rows = [];
  let row = [], field = '', quoted = false;
  for (let i = 0; i < text.length; i++) {
    const c = text[i];
    if (quoted) {
      if (c === '"') { if (text[i + 1] === '"') { field += '"'; i++; } else quoted = false; }
      else field += c;
    } else if (c === '"') quoted = true;
    else if (c === delim) { row.push(field); field = ''; }
    else if (c === '\n') { row.push(field); rows.push(row); row = []; field = ''; }
    else if (c !== '\r') field += c;
  }
  if (field || row.length) { row.push(field); rows.push(row); }
  return rows;
}

function parseDate(raw, tag, field) {
  const s = String(raw == null ? '' : raw).trim();
  if (!s) return null;
  let y, m, d, mm;
  if ((mm = s.match(/^(\d{4})\s*[-./]\s*(\d{1,2})\s*[-./]\s*(\d{1,2})\.?(?:[T\s].*)?$/))) {
    [y, m, d] = [+mm[1], +mm[2], +mm[3]];                                  // 2026-11-15, 2026. 11. 15.
  } else if ((mm = s.match(/^(\d{1,2})\s*([./-])\s*(\d{1,2})\s*\2\s*(\d{4})\.?$/))) {
    const a = +mm[1], b = +mm[3];                                          // 15/11/2026, 11/15/2026
    y = +mm[4];
    if (a > 12) [d, m] = [a, b];
    else if (b > 12) [m, d] = [a, b];
    else {
      if (mm[2] === '/') [m, d] = [a, b]; else [d, m] = [a, b];

    }

  } else if (/^\d{5}$/.test(s)) {

  }

}
function guardDate(n, s, tag, field) {

  const en = ['jan', 'feb', 'mar', 'apr', 'may', 'jun', 'jul', 'aug', 'sep', 'oct', 'nov', 'dec'];
  let i = hu.findIndex(p => k.startsWith(p));
  if (i < 0) i = en.findIndex(p => k.startsWith(p));
  return i + 1;
}
function cleanLink(raw, tag) {
  let s = String(raw || '').trim();
  if (!s) return '';
  if (/^www\./i.test(s)) s = 'https://' + s;
  try {
    const u = new URL(s);
    if (/^(https?|mailto):$/.test(u.protocol)) return u.href;
  } catch (e) { /* not a URL */ }
  warn(`${tag}: link "${raw}" is not a valid web address – ignored.`);
  return '';
}
function colorFor(i) {
  const pal = Array.isArray(CONFIG.BRANCH_COLORS) && CONFIG.BRANCH_COLORS.length ? CONFIG.BRANCH_COLORS : ['#6a8cd8'];
  if (i < pal.length) return pal[i];
  if (i === pal.length) warn(`More than ${pal.length} branches – the extra ones are shown in grey.`);
  return EXTRA_COLOR;
}

/* ---------- horizons ---------- */
function computeBands() {
  const defaults = { now: [0, 3, 'Most'], next: [3, 9, 'Következő'], later: [9, 18, 'Később'] };
  return HKEYS.map(key => {
    const h = (CONFIG.HORIZONS && CONFIG.HORIZONS[key]) || {};
    const fromM = Number.isFinite(+h.fromMonths) && h.fromMonths !== '' ? +h.fromMonths : defaults[key][0];
    let toM = Number.isFinite(+h.toMonths) && h.toMonths !== '' ? +h.toMonths : defaults[key][1];
    if (toM <= fromM) { warn(`HORIZONS.${key}: toMonths must be larger than fromMonths – fixed.`); toM = fromM + 3; }
    return { key, label: h.label || defaults[key][2], fromM, toM, from: addMonths(TODAY, fromM), to: addMonths(TODAY, toM) };
  });

const windowText = (key, short) => {
  const b = band(key), unit = short ? 'hó' : 'hónap';
  return key === 'later' ? `${fmtNum(b.fromM)}+ ${unit}` : `${fmtNum(b.fromM)}–${fmtNum(b.toM)} ${unit}`;

/* ---------- sheet rows → branches, lanes, goals ---------- */
function buildModel(rows) {
  const hi = rows.findIndex(r => r.some(c => String(c).trim()));
  if (hi < 0) return { branches: [], goals: [] };
  const header = rows[hi].map(h => HEADER_MAP[norm(String(h).replace(/^﻿/, ''))] || null);
  const col = {};

    if (!horizon) { warn(`${tag}: ${hraw ? `invalid horizon "${hraw}"` : 'missing horizon'} – using "later".`); horizon = 'later'; }
    const sraw = get('status');
    let status = STATUS_MAP[norm(sraw)];

    let due = parseDate(get('due_date'), tag, 'due_date');
    if (start != null && due != null && due < start) { warn(`${tag}: due_date is before start_date – swapped.`); [start, due] = [due, start]; }
    const kind = start != null && due != null ? 'range' : due != null ? 'milestone' : start != null ? 'open' : 'undated';

    const bkey = norm(bname);
    let b = bmap.get(bkey);
    if (!b) {

    const g = { id: goals.length, row: rowNo, title, desc: get('description'), horizon, status, start, due, kind, owner: get('owner'), link: cleanLink(get('link'), tag), branch: b, lane };

/* Dates win over the horizon, but obvious mismatches are reported */

  for (const g of goals) {

    const [lo, hi] = win[g.horizon];

function computeRange(goals) {
  let lo = TODAY - 30, hi = band('later').to;
  for (const g of goals) for (const d of [g.start, g.due, g.end]) {
    if (d != null) { lo = Math.min(lo, d - 10); hi = Math.max(hi, d + 20); }

/* ---------- geometry ---------- */

  const labelW = compact ? 0 : labelWidthFor(vw);
  const days = S.range.end - S.range.start;
  let ppd = PX_PER_DAY[S.zoom] * (compact ? 0.9 : 1);
  ppd = Math.max(ppd, (vw - labelW - 18) / days);      // never leave empty space on the right
  const width = Math.round(days * ppd);
  return { compact, labelW, ppd, width, x: n => (n - S.range.start) * ppd };

  const compact = window.innerWidth < 640;

  const avail = vw - (compact ? 0 : labelWidthFor(vw)) - 18;
  let last = band('now').to;                            // how far the data reaches
  for (const g of S.model.goals) last = Math.max(last, g.kind === 'undated' ? band(g.horizon).to : (g.due != null ? g.due : g.end));
  const focusEnd = Math.min(last, band(compact ? 'now' : 'next').to);

/* Where undated goals of a horizon are spread out */

  return [{ tag: true, text: band(g.horizon).label, h: g.horizon }, { text: date }];

    if (!list.length) continue;

/* ---------- scrolling & zoom ---------- */

  el.app.classList.remove('ready');
  el.legend.hidden = true;
  el.scroller.hidden = true;
  el.state.hidden = false;
  el.state.innerHTML = html;
}
function showError(err) {
  const kind = err && err.kind;
  const local = location.protocol === 'file:' && !String(CONFIG.CSV_URL || '').trim();
  const hints = {
    network: local ? 'Helyi fájlként megnyitva a böngésző nem engedi betölteni a roadmap_template.csv-t. Add meg a CSV_URL-t, vagy nyisd meg az oldalt webszerveren (pl. GitHub Pages) keresztül.'
                   : 'Nem sikerült elérni az adatforrást (nincs internet, vagy a hozzáférés tiltott).',
    timeout: 'Az adatforrás nem válaszolt 20 másodpercen belül.',
    http: 'Az adatforrás hibát adott vissza. Ellenőrizd, hogy a táblázat közzé van-e téve („Publish to web”), és hogy a CSV_URL pontos-e.',
    html: 'A megadott link nem CSV-t ad vissza. A „Publish to web” ablakban a „Comma-separated values (.csv)” formátumot kell választani, és az ott kapott linket kell a CSV_URL-be másolni.',
    columns: 'A táblázat első sorából hiányzik a „goal” oszlop. Az első sor oszlopnevei: branch, sub_branch, goal, description, horizon, start_date, due_date, status, owner, link.',
  };
  const lead = local && kind === 'network' ? hints.network
    : kind === 'html' || kind === 'columns' ? 'Az adatforrás nem a várt táblázatot adta vissza. A részletek az oldal karbantartójának szólnak.'
    : 'Lehet, hogy átmeneti hálózati hiba történt. Érdemes néhány perc múlva újra megpróbálni.';
  showMessage(`<div class="msg" role="alert"><div class="msg-ic">!</div><h2>Az ütemterv most nem tölthető be</h2>`
    + `<p>${esc(lead)}</p>`
    + `<button type="button" class="btn" id="retryBtn">Újrapróbálás</button>`
    + `<details><summary>Technikai részletek</summary><p>${esc(hints[kind] || 'Váratlan hiba történt.')}</p><code>${esc((err && (err.detail || err.message)) || '')}</code></details></div>`);
  $('#retryBtn').addEventListener('click', boot);
}
function renderLegend() {
  const groups = [
    ['Állapot', Object.keys(STATUS).map(k => `<span class="lg-item">${ICON[k]}${STATUS[k]}</span>`)],
    ['Jelölés', ['<span class="lg-item"><span class="sw-ms"></span>Határidő</span>', '<span class="lg-item"><span class="sw-card"></span>Hozzávetőleges (dátum nélkül)</span>']],
  ];
  el.legend.innerHTML = groups.map(([t, items]) => `<div class="lg-group"><span class="lg-title">${t}</span>${items.join('')}</div>`).join('');
}
function showDebugPanel() {
  const box = document.createElement('div');
  const n = S.warnings.length;
  box.className = 'dbg';
  box.innerHTML = `<strong>Ellenőrzés: ${n ? n + ' figyelmeztetés' : 'nincs hiba ✓'}</strong>`
    + (n ? `<ol>${S.warnings.map(w => `<li>${esc(w)}</li>`).join('')}</ol>` : '')
    + '<button type="button" aria-label="Bezárás">×</button>';
  box.querySelector('button').addEventListener('click', () => box.remove());
  document.body.appendChild(box);
}

/* ---------- start ---------- */
async function boot() {
  S.warnings = [];
  document.querySelectorAll('.dbg').forEach(n => n.remove());
  showLoading();
  try {
    const { text, lastModified } = await fetchCSV();
    S.bands = computeBands();
    const model = buildModel(parseCSV(text));
    S.model = null;
    if (!model.goals.length) {
      showMessage('<div class="msg empty"><div class="msg-ic">i</div><h2>Még nincs megjeleníthető cél</h2><p>Az ütemterv táblázata üres.</p></div>');
      return;
    }
    S.model = model;
    checkHorizons(model.goals);
    S.range = computeRange(model.goals);
    renderLegend();
    const stamp = lastModified && !isNaN(lastModified) && lastModified <= new Date(Date.now() + DAY) ? lastModified : new Date();
    el.updated.textContent = 'Frissítve: ' + fmtStamp(stamp);
    el.updated.title = lastModified ? 'A táblázat legutóbbi közzétett változata' : 'Az adatok betöltésének időpontja';
    el.state.hidden = true;
    el.scroller.hidden = false;
    el.app.classList.add('ready');
    setLegend(el.legendBtn.getAttribute('aria-expanded') === 'true');
    S.zoom = PX_PER_DAY[CONFIG.DEFAULT_ZOOM] ? CONFIG.DEFAULT_ZOOM : autoZoom();
    S.focus = TODAY;
    render();
    scrollToDay(TODAY, 0.5);
    if (S.warnings.length) console.info(`[Roadmap] ${S.warnings.length} warning(s). Open the page with ?debug at the end of the address to see them on screen.`);
  } catch (err) {
    console.error('[Roadmap] Could not load the roadmap:', err);
    showError(err);
  }
  if (DEBUG) showDebugPanel();
}

/* ---------- events ---------- */
const drag = { on: false, moved: false, block: false };
el.inner.addEventListener('click', e => {
  if (drag.block) return;
  const item = e.target.closest('[data-goal]');
  if (item) {
    const g = S.model.goals[+item.dataset.goal];
    if (S.pop && S.pop.anchor === item) closePop();
    else openPop(g, item, e.detail ? e.clientX : null);
    return;
  }
  const t = e.target.closest('[data-toggle]');
  if (t) toggleBranch(t.dataset.toggle);
});
el.inner.addEventListener('keydown', e => {
  if (e.key !== 'Enter' && e.key !== ' ') return;
  const t = e.target;
  if (t.matches('[data-goal]')) { e.preventDefault(); openPop(S.model.goals[+t.dataset.goal], t, null); }
  else if (t.matches('.lbl-branch')) { e.preventDefault(); toggleBranch(t.dataset.toggle, true); }
});
document.addEventListener('pointerdown', e => {
  if (S.pop && !S.pop.pop.contains(e.target) && !e.target.closest('[data-goal]')) closePop();
}, true);
document.addEventListener('keydown', e => { if (e.key === 'Escape' && S.pop) closePop(true); });

/* drag with the mouse to pan the timeline */
el.scroller.addEventListener('pointerdown', e => {
  if (e.pointerType !== 'mouse' || e.button !== 0) return;
  if (e.target.closest('[data-goal], [data-toggle], a, button')) return;
  const r = el.scroller.getBoundingClientRect();
  if (e.clientX >= r.left + el.scroller.clientWidth || e.clientY >= r.top + el.scroller.clientHeight) return;   // scrollbar
  Object.assign(drag, { on: true, moved: false, x: e.clientX, y: e.clientY, left: el.scroller.scrollLeft, top: el.scroller.scrollTop });
});
window.addEventListener('pointermove', e => {
  if (!drag.on) return;
  const dx = e.clientX - drag.x, dy = e.clientY - drag.y;
  if (!drag.moved && Math.hypot(dx, dy) < 4) return;
  if (!drag.moved) { drag.moved = true; el.scroller.classList.add('dragging'); }
  el.scroller.scrollLeft = drag.left - dx;
  el.scroller.scrollTop = drag.top - dy;
});
window.addEventListener('pointerup', () => {
  if (!drag.on) return;
  drag.on = false;
  if (drag.moved) {
    el.scroller.classList.remove('dragging');
    drag.block = true;
    setTimeout(() => { drag.block = false; }, 0);
  }
});

el.scroller.addEventListener('scroll', () => {
  const left = el.scroller.scrollLeft;
  el.scroller.classList.toggle('scrolled-x', left > 2);
  if (left !== S.lastLeft && performance.now() > S.quietUntil && S.geom) S.focus = centerDay();   // the reader scrolled sideways
  S.lastLeft = left;
  if (S.pop && !S.pop.sheet) requestAnimationFrame(positionPop);
}, { passive: true });
el.zoomBtns.forEach(btn => btn.addEventListener('click', () => setZoom(btn.dataset.zoom)));
el.today.addEventListener('click', () => { if (S.model) { S.focus = TODAY; scrollToDay(TODAY, 0.5, true); } });
function setLegend(open) { el.legend.hidden = !open; el.legendBtn.setAttribute('aria-expanded', String(open)); }
el.legendBtn.addEventListener('click', () => setLegend(el.legend.hidden));

let lastWidth = window.innerWidth, resizeTimer;
window.addEventListener('resize', () => {
  if (!S.model || el.scroller.hidden || window.innerWidth === lastWidth) return;   // ignore height-only changes (mobile toolbars)
  clearTimeout(resizeTimer);
  resizeTimer = setTimeout(() => {
    lastWidth = window.innerWidth;
    render();
    scrollToDay(S.focus, 0.5);
  }, 150);
});

/* header texts */
document.title = `${CONFIG.ORG_NAME} · Ütemterv`;
$('#orgName').textContent = CONFIG.ORG_NAME;
el.demo.hidden = !!String(CONFIG.CSV_URL || '').trim();
setLegend(false);
boot();
</script>
</body>
</html>
